---
# pingpong.yml
# Commit to the root of https://github.com/mglantz/ansible-playbooks.
# Used by the "Event action" job template, which the rulebook launches.
#
# The rulebook passes event.payload.message as webhook_message. The job
# fails unless that message is exactly "OK" (case-sensitive).

- name: Event action
  hosts: all
  gather_facts: false

  vars:
    webhook_message: "No message supplied (job was not started by the rulebook)"

  tasks:
    - name: Print the message passed on by the rulebook
      ansible.builtin.debug:
        msg: "Message from rulebook: {{ webhook_message }}"

    - name: Fail unless the message from the rulebook is "OK"
      ansible.builtin.assert:
        that:
          - webhook_message == "OK"
        fail_msg: "Event rejected: expected message 'OK' but got '{{ webhook_message }}'"
        success_msg: "Message is OK"

    - name: Ping the system
      ansible.builtin.ping:
